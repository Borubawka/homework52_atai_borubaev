<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>To Do List</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f3f3f3;
            padding: 20px;
        }

        h1 {
            color: darkblue;
        }

        .task {
            background-color: white;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<h1>Список задач</h1>
<p>
    <a href="/add/">Добавить задачу</a>
</p>
{% for task in tasks %}

<div class="task">
    <h3>{{ task.description }}</h3>

    <p>Статус: {{ task.get_status_display }}</p>

    {% if task.due_date %}
    <p>Дата выполнения: {{ task.due_date|date:"d.m.y" }}</p>
{% else %}
    <p>Дата выполнения не указана</p>
{% endif %}
    <p>
    <a href="/task/{{ task.id }}/">Подробнее</a>
    </p>
    <p>
    <a href="/delete/?pk={{ task.pk }}">
        Удалить
    </a>
</p>
</div>

{% endfor %}

</body>
</html>
