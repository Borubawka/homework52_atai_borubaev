{% extends 'base.html' %}
{% block title %}
Удаление проекта
{% endblock %}
{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card border-danger shadow-sm">

            <div class="card-header bg-danger text-white">

                Удаление проекта

            </div>

            <div class="card-body">

                <h4>

                    {{ object.name }}

                </h4>

                <p>

                    Вы уверены, что хотите удалить проект?

                </p>

                <form method="POST">

                    {% csrf_token %}

                    <button
                        type="submit"
                        class="btn btn-danger"
                    >
                        Удалить
                    </button>

                    <a
                        href="{% url 'project_detail' object.id %}"
                        class="btn btn-secondary"
                    >
                        Отмена
                    </a>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
