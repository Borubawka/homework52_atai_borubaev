{% csrf_token %}

<div>
    <label>Описание</label>
    <textarea name="description" required>{{ task.description }}</textarea>
</div>

<div>
    <label>Подробное описание</label>
    <textarea name="details">{{ task.details }}</textarea>
</div>

<div>
    <label>Статус</label>

    <select name="status">

        <option value="new"
            {% if task.status == 'new' %}
                selected
            {% endif %}
        >
            Новая
        </option>

        <option value="in_progress"
            {% if task.status == 'in_progress' %}
                selected
            {% endif %}
        >
            В процессе
        </option>

        <option value="done"
            {% if task.status == 'done' %}
                selected
            {% endif %}
        >
            Сделано
        </option>

    </select>
</div>

<div>
    <label>Дата выполнения</label>

    <input
        type="date"
        name="due_date"
        value="{{ task.due_date|date:'Y-m-d' }}"
    >
</div>
