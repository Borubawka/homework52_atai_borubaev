<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Добавить задачу</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f3f3f3;
            padding: 20px;
        }

        h1 {
            color: darkgreen;
        }

        form {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            width: 400px;
        }

        input,
        select,
        textarea {
            width: 100%;
            margin-bottom: 15px;
            padding: 8px;
        }

        button {
            background-color: darkgreen;
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<h1>Добавить задачу</h1>

<p>
    <a href="/">На главную</a>
</p>

<form method="POST">

    {% csrf_token %}

    <label>Описание</label>
    <textarea name="description" required></textarea>

    <label>Подробное описание</label>
    <textarea name="details"></textarea>

    <label>Статус</label>

    <select name="status">

        <option value="new">Новая</option>

        <option value="in_progress">
            В процессе
        </option>

        <option value="done">
            Сделано
        </option>

    </select>

    <label>Дата выполнения</label>

    <input type="date" name="due_date">

    <button type="submit">
        Добавить
    </button>

</form>

</body>
</html>
