{% extends 'base.html' %}
{% block title %}
Вход
{% endblock %}
{% block content %}

<div class="row justify-content-center">

    <div class="col-md-5">

        <div class="card shadow">

            <div class="card-header">
                <h3 class="mb-0">
                    Вход в систему
                </h3>
            </div>

            <div class="card-body">

                {% if form.errors %}

                    <div class="alert alert-danger">
                        Неверный логин или пароль.
                    </div>

                {% endif %}

                <form method="post">

                    {% csrf_token %}

                    <div class="mb-3">

                        <label class="form-label">
                            Логин
                        </label>

                        <input
                            type="text"
                            name="username"
                            class="form-control"
                            required
                        >

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Пароль
                        </label>

                        <input
                            type="password"
                            name="password"
                            class="form-control"
                            required
                        >

                    </div>

                    <button
                        type="submit"
                        class="btn btn-primary w-100"
                    >
                        Войти
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
